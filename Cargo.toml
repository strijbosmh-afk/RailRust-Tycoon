[workspace]
members = ["crates/park_sim", "crates/park_game"]
resolver = "2"

[workspace.package]
version = "0.35.0"
edition = "2024"
rust-version = "1.88"
publish = false

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
strip = "debuginfo"
