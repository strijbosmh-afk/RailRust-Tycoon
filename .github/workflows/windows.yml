          if ($LASTEXITCODE -ne 0) { throw "Fresh-process queue continuation failed" }
          Get-Content -LiteralPath (Join-Path $queueDirectory "verification-queues.txt")
      # Admission proof covers occupied queues, paused cancellation, and exact
      # continuation independently of the earlier topology-only fixture.
      - name: Verify guest admission across fresh processes
        shell: pwsh
