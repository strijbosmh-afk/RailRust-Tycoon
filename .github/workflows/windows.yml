name: Windows checks and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy, rust-docs
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --release --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --release --workspace --locked
      - name: Build the Windows distribution
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Verify continuation across fresh processes
        shell: pwsh
        run: |
          $proofDirectory = Join-Path $env:RUNNER_TEMP ("Parkbound save proof é " + [guid]::NewGuid())
          & ./target/release/parkbound.exe --save-check write --save-dir $proofDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Save proof writer failed" }
          & ./target/release/parkbound.exe --save-check verify --save-dir $proofDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fresh-process continuation failed" }
          Get-Content -LiteralPath (Join-Path $proofDirectory "verification.txt")
          $pathDirectory = Join-Path $env:RUNNER_TEMP ("Parkbound path proof é " + [guid]::NewGuid())
          & ./target/release/parkbound.exe --save-check write-paths --save-dir $pathDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Path construction proof writer failed" }
          & ./target/release/parkbound.exe --save-check verify-paths --save-dir $pathDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fresh-process path continuation failed" }
          Get-Content -LiteralPath (Join-Path $pathDirectory "verification-paths.txt")
      - name: Verify terrain edits across fresh processes
        shell: pwsh
        run: |
          $terrainDirectory = Join-Path $env:RUNNER_TEMP ("Parkbound terrain proof é " + [guid]::NewGuid())
          & ./target/release/parkbound.exe --save-check write-terrain --save-dir $terrainDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Terrain editing proof writer failed" }
          & ./target/release/parkbound.exe --save-check verify-terrain --save-dir $terrainDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fresh-process terrain continuation failed" }
          Get-Content -LiteralPath (Join-Path $terrainDirectory "verification-terrain.txt")
      - name: Verify sloped paths across fresh processes
        shell: pwsh
