name: Windows checks and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy, rust-docs
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --release --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --release --workspace --locked
      - name: Build the Windows distribution
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Verify continuation across fresh processes
        shell: pwsh
        run: |
          $proofDirectory = Join-Path $env:RUNNER_TEMP ("Parkbound save proof é " + [guid]::NewGuid())
          & ./target/release/parkbound.exe --save-check write --save-dir $proofDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Save proof writer failed" }
          & ./target/release/parkbound.exe --save-check verify --save-dir $proofDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fresh-process continuation failed" }
          Get-Content -LiteralPath (Join-Path $proofDirectory "verification.txt")
          $pathDirectory = Join-Path $env:RUNNER_TEMP ("Parkbound path proof é " + [guid]::NewGuid())
          & ./target/release/parkbound.exe --save-check write-paths --save-dir $pathDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Path construction proof writer failed" }
          & ./target/release/parkbound.exe --save-check verify-paths --save-dir $pathDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fresh-process path continuation failed" }
          Get-Content -LiteralPath (Join-Path $pathDirectory "verification-paths.txt")
      - name: Verify terrain edits across fresh processes
        shell: pwsh
        run: |
          $terrainDirectory = Join-Path $env:RUNNER_TEMP ("Parkbound terrain proof é " + [guid]::NewGuid())
          & ./target/release/parkbound.exe --save-check write-terrain --save-dir $terrainDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Terrain editing proof writer failed" }
          & ./target/release/parkbound.exe --save-check verify-terrain --save-dir $terrainDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fresh-process terrain continuation failed" }
          Get-Content -LiteralPath (Join-Path $terrainDirectory "verification-terrain.txt")
      - name: Verify sloped paths across fresh processes
        shell: pwsh
        run: |
          $slopeDirectory = Join-Path $env:RUNNER_TEMP ("Parkbound slope proof é " + [guid]::NewGuid())
          & ./target/release/parkbound.exe --save-check write-slopes --save-dir $slopeDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Sloped path proof writer failed" }
          & ./target/release/parkbound.exe --save-check verify-slopes --save-dir $slopeDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fresh-process slope continuation failed" }
          Get-Content -LiteralPath (Join-Path $slopeDirectory "verification-slopes.txt")
      - name: Verify queues and entrances across fresh processes
        shell: pwsh
        run: |
          $queueDirectory = Join-Path $env:RUNNER_TEMP ("Parkbound queue proof é " + [guid]::NewGuid())
          & ./target/release/parkbound.exe --save-check write-queues --save-dir $queueDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Queue proof writer failed" }
          & ./target/release/parkbound.exe --save-check verify-queues --save-dir $queueDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fresh-process queue continuation failed" }
          Get-Content -LiteralPath (Join-Path $queueDirectory "verification-queues.txt")
      # Admission proof covers occupied queues, paused cancellation, and exact
      # continuation independently of the earlier topology-only fixture.
      - name: Verify guest admission across fresh processes
        shell: pwsh
        run: |
          $admissionDirectory = Join-Path $env:RUNNER_TEMP ("Parkbound admission proof é " + [guid]::NewGuid())
          & ./target/release/parkbound.exe --save-check write-admission --save-dir $admissionDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Guest admission proof writer failed" }
          & ./target/release/parkbound.exe --save-check verify-admission --save-dir $admissionDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fresh-process guest admission continuation failed" }
          Get-Content -LiteralPath (Join-Path $admissionDirectory "verification-admission.txt")
      - name: Verify complete ride journeys across fresh processes
        shell: pwsh
        run: |
          $journeyDirectory = Join-Path $env:RUNNER_TEMP ("Parkbound ride journey proof é " + [guid]::NewGuid())
          & ./target/release/parkbound.exe --save-check write-journey --save-dir $journeyDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Ride journey writer failed" }
          & ./target/release/parkbound.exe --save-check verify-journey --save-dir $journeyDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fresh-process ride journey continuation failed" }
          Get-Content -LiteralPath (Join-Path $journeyDirectory "verification-journey.txt")
      - name: Verify ride economy across fresh processes
        shell: pwsh
        run: |
          $economyDirectory = Join-Path $env:RUNNER_TEMP ("Parkbound ride economy proof é " + [guid]::NewGuid())
          & ./target/release/parkbound.exe --save-check write-economy --save-dir $economyDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Ride economy writer failed" }
          & ./target/release/parkbound.exe --save-check verify-economy --save-dir $economyDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fresh-process ride economy continuation failed" }
          Get-Content -LiteralPath (Join-Path $economyDirectory "verification-economy.txt")
      - name: Verify guest feedback across fresh processes
        shell: pwsh
        run: |
          $feedbackDirectory = Join-Path $env:RUNNER_TEMP ("Parkbound guest feedback proof é " + [guid]::NewGuid())
          & ./target/release/parkbound.exe --save-check write-feedback --save-dir $feedbackDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Guest feedback writer failed" }
          & ./target/release/parkbound.exe --save-check verify-feedback --save-dir $feedbackDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fresh-process guest feedback continuation failed" }
          Get-Content -LiteralPath (Join-Path $feedbackDirectory "verification-feedback.txt")
      - name: Verify guest services across fresh processes
        shell: pwsh
        run: |
          $servicesDirectory = Join-Path $env:RUNNER_TEMP ("Parkbound guest services proof é " + [guid]::NewGuid())
          & ./target/release/parkbound.exe --save-check write-services --save-dir $servicesDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Guest services writer failed" }
          & ./target/release/parkbound.exe --save-check verify-services --save-dir $servicesDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fresh-process guest services continuation failed" }
          Get-Content -LiteralPath (Join-Path $servicesDirectory "verification-services.txt")
      - name: Verify service finances across fresh processes
        shell: pwsh
        run: |
          $financeDirectory = Join-Path $env:RUNNER_TEMP ("Parkbound service finance proof é " + [guid]::NewGuid())
          & ./target/release/parkbound.exe --save-check write-finance --save-dir $financeDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Service finance writer failed" }
          & ./target/release/parkbound.exe --save-check verify-finance --save-dir $financeDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fresh-process service finance continuation failed" }
          Get-Content -LiteralPath (Join-Path $financeDirectory "verification-finance.txt")
      - name: Verify independent rides and guest choice across fresh processes
        shell: pwsh
        run: |
          $ridesDirectory = Join-Path $env:RUNNER_TEMP ("Parkbound dual rides proof é " + [guid]::NewGuid())
          & ./target/release/parkbound.exe --save-check write-rides --save-dir $ridesDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Dual rides writer failed" }
          & ./target/release/parkbound.exe --save-check verify-rides --save-dir $ridesDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fresh-process dual ride continuation failed" }
          Get-Content -LiteralPath (Join-Path $ridesDirectory "verification-rides.txt")
      - name: Verify ride construction and refunds across fresh processes
        shell: pwsh
        run: |
          $constructionDirectory = Join-Path $env:RUNNER_TEMP ("Parkbound construction proof é " + [guid]::NewGuid())
          & ./target/release/parkbound.exe --save-check write-construction --save-dir $constructionDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Ride construction writer failed" }
          & ./target/release/parkbound.exe --save-check verify-construction --save-dir $constructionDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fresh-process ride construction continuation failed" }
          Get-Content -LiteralPath (Join-Path $constructionDirectory "verification-construction.txt")
      - name: Verify paid facility construction and refunds across fresh processes
        shell: pwsh
        run: |
          $facilityConstructionDirectory = Join-Path $env:RUNNER_TEMP ("Parkbound paid facilities proof é " + [guid]::NewGuid())
          & ./target/release/parkbound.exe --save-check write-facility-construction --save-dir $facilityConstructionDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Paid facilities writer failed" }
          & ./target/release/parkbound.exe --save-check verify-facility-construction --save-dir $facilityConstructionDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fresh-process paid facilities continuation failed" }
          Get-Content -LiteralPath (Join-Path $facilityConstructionDirectory "verification-facility-construction.txt")
      - name: Verify paid track, refunds and saved drafts across fresh processes
        shell: pwsh
        run: |
          $trackConstructionDirectory = Join-Path $env:RUNNER_TEMP ("Parkbound track construction proof é " + [guid]::NewGuid())
          & ./target/release/parkbound.exe --save-check write-track-construction --save-dir $trackConstructionDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Track construction writer failed" }
          & ./target/release/parkbound.exe --save-check verify-track-construction --save-dir $trackConstructionDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fresh-process track construction continuation failed" }
          Get-Content -LiteralPath (Join-Path $trackConstructionDirectory "verification-track-construction.txt")
      - name: Verify named track designs across fresh processes
        shell: pwsh
        run: |
          $designDirectory = Join-Path $env:RUNNER_TEMP ("Parkbound named designs proof é " + [guid]::NewGuid())
          & ./target/release/parkbound.exe --save-check write-designs --save-dir $designDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Named designs writer failed" }
          & ./target/release/parkbound.exe --save-check verify-designs --save-dir $designDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fresh-process named designs verification failed" }
          Get-Content -LiteralPath (Join-Path $designDirectory "writer-designs.txt")
          Get-Content -LiteralPath (Join-Path $designDirectory "verification-designs.txt")
      - name: Verify design import and export across fresh processes
        shell: pwsh
        run: |
          $transferDirectory = Join-Path $env:RUNNER_TEMP ("Parkbound design transfer é " + [guid]::NewGuid())
          & ./target/release/parkbound.exe --save-check write-design-transfer --save-dir $transferDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Design transfer writer failed" }
          & ./target/release/parkbound.exe --save-check verify-design-transfer --save-dir $transferDirectory | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Fresh-process design transfer verification failed" }
          Get-Content -LiteralPath (Join-Path $transferDirectory "writer-design-transfer.txt")
          Get-Content -LiteralPath (Join-Path $transferDirectory "verification-design-transfer.txt")
      - name: Store the build for review
        uses: actions/upload-artifact@v4
        with:
          name: Parkbound-windows-x64
          path: |
            dist/Parkbound-*-windows-x64.zip
            dist/Parkbound-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Smoke test CPU performance reporting
        shell: pwsh
        run: |
          $measurementDirectory = Join-Path $env:RUNNER_TEMP ("Parkbound measurement é " + [guid]::NewGuid())
          ./scripts/measure-performance.ps1 -OutputDirectory $measurementDirectory -Cases baseline -Repetitions 1 -BenchmarkTicks 30 -SkipFrames
          Copy-Item -LiteralPath $measurementDirectory -Destination ./artifacts/performance-ci -Recurse
      - name: Store measurement smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: Parkbound-measurement-smoke
          path: artifacts/performance-ci
          if-no-files-found: error
          retention-days: 14
